server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    location / {
        # Astro MPA directory routing (e.g. /login serves /login/index.html)
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Cache static assets aggressively (Astro hashes CSS/JS assets in _astro/)
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico|json)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Reverse proxy to FastAPI backend
    location /api/ {
        # Strip '/api' from path before sending to backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        
        # Keepalive and headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Avoid buffering for fast stream responses if needed
        proxy_buffering off;
    }

    # Error handling
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
